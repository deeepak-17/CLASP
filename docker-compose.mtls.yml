# Registry behind mutual TLS (D7). Overlay on the main file:
#
#   scripts/make_dev_certs.sh                       # dev CA + certs -> .runtime/certs
#   docker compose -f docker-compose.yml -f docker-compose.mtls.yml up -d registry
#   curl --cacert .runtime/certs/ca.pem --cert .runtime/certs/client.pem \
#        --key .runtime/certs/client.key https://localhost:8004/healthz
#
# Every connection must present a client cert signed by the CA and speak TLS 1.3;
# a request without one is refused at the handshake. Scope: this hardens the
# registry endpoint. Its HTTP callers (cluster seam B, edge C1/C2) must present
# client certs too before they can use it — that client-side wiring is the
# security library's (P3), so leave this overlay off for the plain demo round.
services:
  registry:
    environment:
      CLASP_TLS_CERT: /certs/registry.pem
      CLASP_TLS_KEY: /certs/registry.key
      CLASP_TLS_CA: /certs/ca.pem
    volumes:
      # Only the registry's own cert/key and the CA cert — never the CA key.
      - ./.runtime/certs/registry:/certs:ro
