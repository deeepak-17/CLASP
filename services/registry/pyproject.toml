[project]
name = "clasp-registry"
version = "0.1.0"
description = "CLASP State Registry — safetensors versioning, two-sided promotion, FastAPI (P4)."
requires-python = ">=3.10"
dependencies = [
    "clasp-contracts>=1.1,<2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    # D6 composites: exact factor concatenation, no torch needed.
    "numpy>=1.26",
    "safetensors>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
