[project]
name = "clasp-cluster"
version = "0.1.0"
description = "CLASP Cluster Layer — Flower + FedProx aggregation, FastAPI (P2)."
requires-python = ">=3.10"
dependencies = [
    "clasp-contracts",
    "numpy",
    "pydantic>=2",
    "flwr>=1.8",
    "torch",
    "fastapi",
    "uvicorn",
    # /adapters/{id}/download serializes the aggregate as safetensors bytes,
    # and /adapters/{id}/publish (seam B) POSTs them to the registry.
    "safetensors",
    "httpx",
]

[project.optional-dependencies]
test = ["pytest", "httpx", "safetensors"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
