[project]
name = "clasp-edge"
version = "0.1.0"
description = "CLASP Edge Layer — PEFT training, 4-bit inference, dynamic merger (P1)."
requires-python = ">=3.10"
dependencies = [
    "clasp-contracts",
    # B5: the in-project completion metric core (pure python, P5-owned) lives in
    # services/evaluation; the edge runs it against a real model.
    "clasp-evaluation",
    "peft",
    "transformers",
    "torch",
    "opacus",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
