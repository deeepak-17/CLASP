[project]
name = "clasp-edge"
version = "0.1.0"
description = "CLASP Edge Layer — PEFT training, 4-bit inference, dynamic merger (P1)."
requires-python = ">=3.10"
dependencies = [
    "clasp-contracts",
    # B5: the in-project completion metric core (pure python, P5-owned) lives in
    # services/evaluation; the edge runs it against a real model.
    "clasp-evaluation",
    "peft",
    "transformers",
    "torch",
    "opacus",
    # seams A / C1 / C2 and the mTLS transport (edge.registry_client, edge.transport)
    "requests",
]

[project.optional-dependencies]
# The sibling packages edge IMPORTS rather than re-implements. Each is imported
# lazily, inside the code path that needs it, so the edge installs and its CPU
# test leg runs without them:
#   clasp-cluster  -> edge.aggregate        (D2 aggregation, P2)
#   clasp-registry -> edge.promote          (the D5 rule, P4, for the manifest prediction)
#   clasp-security -> edge.train_client --dp, edge.transport.mtls_session (D7, P3)
# They are local packages, not on PyPI: install them from the monorepo first, e.g.
#   pip install -e services/cluster -e services/registry -e security -e "services/edge[integration]"
integration = [
    "clasp-cluster",
    "clasp-registry",
    "clasp-security",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
