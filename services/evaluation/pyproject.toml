[project]
name = "clasp-evaluation"
version = "0.1.0"
description = "CLASP Evaluation & Dashboard — HumanEval/MBPP, Pass@k, React/Recharts (P5)."
requires-python = ">=3.10"
dependencies = [
    "clasp-contracts",
    "jsonschema>=4.18",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# Real-model generation (interfaces/edge_transformers_adapter.py); imported lazily.
model = ["torch", "transformers", "peft"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evaluation.eval_harness.humaneval" = ["*.jsonl", "*.json"]
"evaluation.eval_harness.mbpp" = ["*.jsonl", "*.json"]
"evaluation.interfaces" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "datasets", "dashboard", "__pycache__", "*.egg-info", "build", "dist"]
addopts = "-ra --strict-markers --strict-config"
