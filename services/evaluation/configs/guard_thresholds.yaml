# Evaluation noise thresholds — derived, not chosen.
#
# Regenerate the evidence with `python scripts/build_noise_report.py`; it reads
# this file, recomputes every derived number from the scored anchor, and writes
# results/noise_report.json + reports/eval_noise_report.md.

humaneval_guard:
  # The D5 rule as the registry implements it (registry.promotion
  # GUARD_PASS_AT_1_TOLERANCE). Owned by P4; P5 does not change it.
  tolerance_pass_at_1: 0.02
  # Scored baseline anchor the noise floor is measured from.
  baseline_anchor: "results/humaneval_guard/base_anchor.json"
  # How the edge lane generated results/humaneval_guard/base_samples.jsonl
  # (edge.humaneval_baseline, `--profile dev --n 20`, its frozen defaults: "do
  # not change without minting a NEW anchor"). Its manifest.json is not
  # committed, so these are the generator's pinned defaults, not a copy of it.
  # Used for the REAL HumanEval record in results.json.
  baseline_generation:
    model_checkpoint: "deepseek-ai/deepseek-coder-1.3b-base (edge dev profile, NF4), no adapter"
    max_new_tokens: 384
    temperature: 0.0
    seed: 0
    stop_sequences: ["\nclass ", "\ndef ", "\n#", "\nif __name__", "\nprint(", "\n@", "\nassert "]
  # Fraction of tasks whose pass/fail flips between baseline and candidate.
  # Assumed until a candidate anchor exists; then the measured value replaces it.
  assumed_discordance: 0.10
  # Size of the full benchmark the guard should move to.
  full_benchmark_size: 164
  # A drop beyond the tolerance but inside the paired noise floor is reported
  # as `within_noise` (not evidence of a regression), never as a pass.
  classification: "regression if drop > max(tolerance, paired noise floor at scored n)"

in_project:
  # D5 (MASTER_PLAN): "promote iff in-project metric improves beyond the noise
  # band (measured from 3 repeated baseline evals)". These are those repeats:
  # baseline (v1) edit similarity of each cluster's representative client from
  # the integration round, run three times end to end with every metric
  # identical (experiments/w12-integration/RESULTS.md; 60 examples, greedy).
  # The band is computed by evaluation.completion.noise_band, the function the
  # edge lane uses for the value it sends the registry.
  d5_baseline_repeats:
    web/client-werkzeug: [0.5337, 0.5337, 0.5337]
    scientific/client-scikit-learn: [0.4837, 0.4837, 0.4837]
  # Supplementary band (does not replace D5's): the 95% paired-bootstrap
  # interval of (candidate - baseline) over the same held-out examples. Needs
  # per-example rows (evaluation.completion.per_example_rows) from the edge run.
  method: "paired bootstrap, 95%, 10000 resamples, seed 0"
  n_examples: 60
  # Exact match is a proportion, so its band has a closed form at this n.
  exact_match_assumed_discordance: 0.10

bootstrap:
  n_resamples: 10000
  confidence: 0.95
  seed: 0
