# Phase III ablation — privacy/utility: client-level DP on LoRA params (D7),
# delta = 1e-5. The non-private baseline is rank-sweep at the chosen rank.
name: epsilon-sweep
owner: P3 Kapilan (runs + epsilon report) · P5 (privacy-utility curve) · P4 (orchestration)
base_model: deepseek-ai/deepseek-coder-1.3b-base
seed: 0
seeds: [0, 1, 2]
# One round with DP-SGD: 1.4 GPU-h x ~1.3 for per-sample gradients (assumption;
# replace with the measured overhead from the first run).
gpu_hours_estimate: 1.8
gpus: 1
budget:
  gpu_hours_total: 22          # 4 x 3 x 1.8 = 21.6
clients: 6
rank: 16
seq_len: 1024
max_steps: 200
rounds: 1
delta: 1.0e-5
sweep:
  epsilon: [1, 2, 4, 8]        # D7 ceiling is 8
notes: ""
