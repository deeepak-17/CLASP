[pytest]
# Pytest configuration for CLASP-P5

# Test discovery: collect only from tests/
testpaths = tests

# Explicitly exclude downloaded datasets and virtual environment
norecursedirs = .venv datasets .git __pycache__ .pytest_cache *.egg-info build dist

# Console output
console_output_style = progress
addopts = -ra --strict-markers --strict-config

# Markers (none defined yet, but strict-markers requires the section)
markers =
