# CLASP — single-command reproducible stack.
# Security (P3) is a library imported by edge & cluster, so it is NOT a service here.
services:
  registry:
    build:
      context: .
      dockerfile: services/registry/Dockerfile
    ports: ["8004:8004"]
    # Registry is STATEFUL: versioned safetensors + metadata must survive restarts.
    environment:
      CLASP_REGISTRY_DATA: /data/registry
    volumes:
      - registry-data:/data/registry
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8004/healthz').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  cluster:
    build:
      context: .
      dockerfile: services/cluster/Dockerfile
    ports: ["8002:8002"]
    depends_on: [registry]

  edge:
    build:
      context: .
      dockerfile: services/edge/Dockerfile
    depends_on: [cluster, registry]

  evaluation:
    build:
      context: .
      dockerfile: services/evaluation/Dockerfile
    # `python -m evaluation` checks the registry is reachable when this is set.
    environment:
      CLASP_REGISTRY_URL: http://registry:8004
    depends_on: [registry]

  # P5 evaluation dashboard (static React build). Results are baked in at build
  # time from services/evaluation/results/; rebuild after re-exporting them.
  dashboard:
    build:
      context: .
      dockerfile: services/evaluation/dashboard/Dockerfile
    ports: ["8005:80"]

# Named volume so adapter versions persist across `compose down`/`up` (D9).
volumes:
  registry-data:
