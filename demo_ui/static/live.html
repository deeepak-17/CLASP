<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CLASP Live Round</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&display=swap" />
<link rel="stylesheet" href="/static/live.css" />
</head>
<body>
<header class="masthead">
  <div>
    <h1>CLASP live round</h1>
    <p>Code stays on each laptop. Only its trained adapter travels here, where each cluster's adapters are merged, versioned and judged.</p>
  </div>
  <div class="side">
    <div class="status" id="healthbar"></div>
    <div class="transport" id="transport"></div>
    <button id="register">Register edge laptops</button>
    <div class="register-note" id="regmsg"></div>
    <div class="links"><a href="/static/page1.html">Earlier panel pages</a></div>
  </div>
</header>

<main id="lanes" aria-live="polite"></main>

<section class="journal">
  <h2>Activity</h2>
  <div class="log" id="log">Nothing yet. Register the edge laptops to open the round.</div>
</section>

<script src="/static/common.js"></script>
<script>
const logEl = document.getElementById("log");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const busy = {};
const errors = {};
const stamped = {};
let seen = {};
let firstLog = true;

function note(text) {
  if (firstLog) { logEl.textContent = ""; firstLog = false; }
  log(logEl, text);
}
const errText = (b) => typeof b.detail === "string" ? b.detail : JSON.stringify(b.detail ?? b);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

async function plan() {
  const { body } = await apiGet("/api/live/plan");
  document.getElementById("transport").innerHTML = body.mtls
    ? "Every link is <b>mutual TLS</b>: each laptop proves who it is with its own certificate."
    : "Links are <b>plain HTTP</b> on the private hotspot.";
}

function edgesStop(c) {
  const st = c.cluster || {};
  const uploaded = st.uploaded_clients || [];
  const members = st.members && st.members.length ? st.members : c.planned_members;
  const all = [...new Set([...members, ...uploaded])].sort();
  const parcels = all.map(m => {
    const has = uploaded.includes(m);
    const state = has ? "Adapter received" : (c.registered ? "Waiting" : "Not registered");
    return `<div class="parcel ${has ? "in" : ""}"><div class="who">${esc(m)}</div><div class="state">${state}</div></div>`;
  }).join("");
  return `<div class="stop"><h3>Edge laptops</h3>
    <p class="lead">${c.registered ? `${uploaded.length} of ${plural(members.length, "adapter", "adapters")} received` : "Not open for uploads yet"}</p>
    <div class="parcels">${parcels}</div></div>`;
}

function mergeStop(cid, c) {
  const st = c.cluster || {};
  const pending = st.pending_uploads || 0;
  const m = (c.last || {}).aggregate;
  let body;
  if (m) {
    const err = m.svd_reconstruction_error || {};
    const eps = m.epsilon == null
      ? `<p class="fine warn">Privacy budget unknown: ${esc((m.epsilon_not_reported_by || []).join(", "))} trained without DP.</p>`
      : `<p class="fine">Privacy budget ε ${fmt(m.epsilon, 2)}, the largest any laptop spent.</p>`;
    body = `<p class="lead">Round ${m.round_id} merged from ${plural(m.num_clients, "laptop", "laptops")}</p>
      <p class="fine">${esc((m.source_clients || []).join(", "))}, weighted by ${esc((m.sample_weights || []).join(" and "))} training blocks.</p>
      <p class="fine">SVD error against the exact average: ${fmt(err.mean, 3)} mean, ${fmt(err.max, 3)} worst.</p>${eps}`;
  } else {
    body = `<p class="lead">${pending ? `${plural(pending, "adapter", "adapters")} ready` : "Waiting for adapters"}</p>
      <p class="fine">The cluster averages the laptops' updates exactly, then compresses the result back to rank 16.</p>`;
  }
  if (m && pending) body += `<p class="fine">${plural(pending, "new adapter has", "new adapters have")} arrived for round ${st.round_id}.</p>`;
  return `<div class="stop"><h3>Cluster merge</h3>${body}
    <div class="act"><button data-act="aggregate" data-c="${cid}" ${!pending || busy[cid] ? "disabled" : ""}>${pending ? `Merge ${plural(pending, "adapter", "adapters")}` : "Merge adapters"}</button></div></div>`;
}

function registryStop(cid, c) {
  const reg = c.registry, st = c.cluster || {};
  const p = (c.last || {}).publish;
  const list = reg.versions.slice(-4).reverse().map(v => `<li class="${v.version === reg.active ? "active" : ""}">
      <b>v${v.version}</b><span>round ${esc(v.round)}, ${esc(v.source_clients.join(", "))}</span></li>`).join("");
  const lead = reg.active ? `${esc(reg.name)}, v${reg.active} serving` : `Nothing published to ${esc(reg.name)} yet`;
  // a merge is published once a version carries its round and its laptops
  const merged = st.aggregated_round_id;
  const done = merged != null && reg.versions.some(v => v.round === merged &&
    v.source_clients.join() === (st.aggregated_clients || []).join());
  const label = !st.has_active_adapter ? "Publish merged adapter" : done ? `Round ${merged} is published` : `Publish round ${merged}`;
  return `<div class="stop"><h3>Registry</h3><p class="lead">${lead}</p>
    ${p ? `<p class="fine">Published v${p.version}, fingerprint ${esc(p.sha256.slice(0, 12))}.</p>` : ""}
    ${list ? `<ul class="versions">${list}</ul>` : ""}
    <div class="act"><button class="quiet" data-act="publish" data-c="${cid}" ${st.has_active_adapter && !done && !busy[cid] ? "" : "disabled"}>${label}</button></div></div>`;
}

function decisionStop(cid, c) {
  const r = (c.last || {}).promote;
  const reg = c.registry;
  const enough = reg.versions.length >= 2;
  const newest = reg.versions.length ? Math.max(...reg.versions.map(v => v.version)) : null;
  // the registry only judges the version it is serving, and only once
  const decided = r && r.candidate_version === newest;
  const canAsk = enough && reg.active === newest && !decided && !busy[cid];
  let body;
  if (r) {
    const d = r.decision, s = r.sent, p = r.provenance;
    const promoted = d.action === "promote";
    const fresh = stamped[cid] !== d.timestamp;
    stamped[cid] = d.timestamp;
    const g = (x) => x && x.length ? fmt(x[0].pass_at_k["1"], 2) : "not scored";
    body = `<div class="stamp ${promoted ? "" : "rollback"} ${fresh ? "fresh" : ""}">${promoted ? "Promoted" : "Rolled back"}
        <small>v${d.active_version_after} ${promoted ? "now serving" : "serving again"}</small></div>
      <p class="why">${esc(d.reason)}</p>
      <p class="numbers">Edit similarity ${fmt(s.in_project.edit_similarity, 4)} against ${fmt(s.baseline_in_project.edit_similarity, 4)}, noise band ${fmt(s.baseline_noise_band, 4)}. HumanEval pass@1 ${g(s.guard)} against ${g(s.baseline_guard)}.</p>
      <details class="source"><summary>Where these numbers come from</summary>
        <p>${esc(p.in_project)}</p><p>${esc(p.guard)}</p><p>Noise band: ${esc(p.noise_band)}</p>
        ${p.stale ? `<p>${esc(p.note)}</p>` : ""}</details>`;
  } else {
    body = `<p class="lead">${enough ? `Ready to judge v${newest}` : "Needs two versions to compare"}</p>
      <p class="fine">The registry keeps the new version only if completion quality beats the last one and HumanEval does not drop.</p>`;
  }
  return `<div class="stop"><h3>Decision</h3>${body}
    <div class="act"><button class="quiet" data-act="promote" data-c="${cid}" ${canAsk ? "" : "disabled"}>${decided ? `v${newest} has been judged` : enough ? `Ask the registry about v${newest}` : "Ask the registry to decide"}</button></div></div>`;
}

function render(state) {
  const root = document.getElementById("lanes");
  root.innerHTML = Object.entries(state.clusters).map(([cid, c]) => {
    const st = c.cluster || {};
    const kind = ["web", "scientific"].includes(cid) ? cid : "";
    return `<section class="lane ${kind}" aria-label="${esc(cid)} cluster">
      <div class="lane-head"><h2>${esc(cid)}</h2>
        ${c.registered ? `<span class="round">round <b>${st.round_id}</b></span>` : `<span class="unregistered">Not registered on the cluster yet</span>`}</div>
      <div class="route">${edgesStop(c)}${mergeStop(cid, c)}${registryStop(cid, c)}${decisionStop(cid, c)}</div>
      ${errors[cid] ? `<div class="lane-error">${esc(errors[cid])}</div>` : ""}
    </section>`;
  }).join("");
  root.querySelectorAll("button[data-act]").forEach(b => b.onclick = () => act(b.dataset.act, b.dataset.c));
}

function announce(state) {
  for (const [cid, c] of Object.entries(state.clusters)) {
    const ups = (c.cluster && c.cluster.uploaded_clients) || [];
    for (const u of ups) if (!(seen[cid] || []).includes(u)) note(`${cid}: adapter received from ${u}`);
    seen[cid] = ups;
  }
}

async function refresh() {
  const r = await apiGet("/api/live/state");
  if (!r.ok) {
    document.getElementById("lanes").innerHTML = `<div class="problem"><b>Can't read the round.</b><p>${esc(errText(r.body))}</p><p>Check that the cluster and registry are running on this laptop.</p></div>`;
    return;
  }
  announce(r.body); render(r.body);
}

const verbs = { aggregate: "Merging", publish: "Publishing", promote: "Asking the registry" };
async function act(action, cid) {
  busy[cid] = true; delete errors[cid]; refresh();
  note(`${cid}: ${verbs[action]}…`);
  const r = await apiPost(`/api/live/${action}/${cid}`);
  busy[cid] = false;
  if (!r.ok) {
    errors[cid] = errText(r.body);
    note(`${cid}: ${verbs[action].toLowerCase()} failed (${r.status}). ${errors[cid]}`);
  } else if (action === "aggregate") note(`${cid}: merged ${plural(r.body.manifest.num_clients, "adapter", "adapters")} into round ${r.body.manifest.round_id}`);
  else if (action === "publish") note(`${cid}: published ${r.body.version.name} v${r.body.version.version}`);
  else note(`${cid}: ${r.body.decision.action === "promote" ? "promoted" : "rolled back"}. ${r.body.decision.reason}`);
  refresh();
}

document.getElementById("register").onclick = async () => {
  const msg = document.getElementById("regmsg");
  const r = await apiPost("/api/live/register");
  if (!r.ok) {
    msg.className = "register-note err";
    msg.textContent = `Couldn't register: ${errText(r.body)}`;
    note(`register failed: ${errText(r.body)}`);
    return;
  }
  msg.className = "register-note";
  msg.textContent = "Registered. " + Object.entries(r.body.registered).map(([c, m]) => `${c}: ${m.join(", ")}`).join("; ") + ".";
  note("Edge laptops registered. They can send adapters now.");
  refresh();
};

plan(); refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
