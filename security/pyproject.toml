[project]
name = "clasp-security"
version = "0.1.0"
description = "CLASP Security (P3) — Opacus DP-SGD + mTLS. Library, not a service."
requires-python = ">=3.10"
dependencies = [
    "clasp-contracts",
    "cryptography>=42.0",
    "PyJWT>=2.0",
    "fastapi>=0.100",
    # security.mtls.peer subclasses uvicorn's h11 protocol
    "uvicorn>=0.29",
    "numpy>=1.24",
]

[project.optional-dependencies]
# DP-SGD (security.dp: make_private, the accountant, the run ledger's
# composition). An extra, so a service that uses only the mTLS, auth,
# middleware and audit parts (the registry) does not install torch. The
# library imports without it; the DP calls then raise a clear ImportError.
dp = ["opacus>=1.4", "torch"]
test = ["pytest", "torch", "opacus>=1.4", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
