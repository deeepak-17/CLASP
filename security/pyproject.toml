[project]
name = "clasp-security"
version = "0.1.0"
description = "CLASP Security (P3) — Opacus DP-SGD + mTLS. Library, not a service."
requires-python = ">=3.10"
dependencies = [
    "clasp-contracts",
    "opacus>=1.5.0",
    "cryptography>=42.0",
    "torch>=2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
